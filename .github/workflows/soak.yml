name: Nightly soak
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A whole match per tier on a random seed. A failure prints the seed to replay it with.
      - run: npm run soak
